<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Leitor QR - Hanbai Motos</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#111;font-family:Arial,Helvetica,sans-serif;color:#fff}
body{padding:16px}
.caixa{max-width:520px;margin:0 auto}
h1{text-align:center;font-size:22px;margin:8px 0 6px}
.sub{text-align:center;color:#bbb;font-size:14px;margin-bottom:18px}
.video-area{position:relative;width:100%;aspect-ratio:1/1;background:#000;border-radius:18px;overflow:hidden;border:2px solid #444}
video{width:100%;height:100%;object-fit:cover;display:block}
.mira{position:absolute;left:12%;top:12%;width:76%;height:76%;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.28);pointer-events:none}
.status{text-align:center;margin:16px 0;min-height:22px;font-size:15px}
button{width:100%;min-height:52px;border:0;border-radius:12px;background:#fff;color:#111;font-size:17px;font-weight:700}
.erro{display:none;background:#3b1518;border:1px solid #8d3038;color:#ffd7da;border-radius:12px;padding:14px;margin-top:14px;line-height:1.4;font-size:14px}
.nota{text-align:center;color:#999;font-size:12px;margin-top:15px}
</style>
</head>
<body>
<div class="caixa">
  <h1>LEITOR QR CODE</h1>
  <div class="sub">Aponte a câmera para o QR Code do chassi</div>

  <div class="video-area">
    <video id="video" autoplay playsinline muted></video>
    <div class="mira"></div>
  </div>

  <div id="status" class="status">Solicitando acesso à câmera...</div>

  <button id="btnFechar" type="button">FECHAR LEITOR</button>

  <div id="erro" class="erro"></div>

  <div class="nota">
    A câmera é usada somente para leitura em tempo real.
    Nenhuma foto é salva no aparelho.
  </div>
</div>

<script>
let stream=null;
let ativo=true;
let animationFrame=null;
let canvas=null;
let contexto=null;

const video=document.getElementById('video');
const status=document.getElementById('status');
const erro=document.getElementById('erro');
const btnFechar=document.getElementById('btnFechar');

function mostrarErro(texto){
  erro.textContent=texto;
  erro.style.display='block';
  status.textContent='Não foi possível iniciar a câmera.';
}

async function iniciarCamera(){

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    mostrarErro(
      'Este navegador não disponibilizou a câmera. Abra o leitor pelo endereço HTTPS do GitHub Pages.'
    );
    return;
  }

  try{

    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject=stream;
    await video.play();

    erro.style.display='none';
    status.textContent='Aponte a câmera para o QR Code...';

    iniciarLeitura();

  }catch(e){

    console.error(e);

    if(e && e.name==='NotAllowedError'){
      mostrarErro(
        'A permissão da câmera foi negada. Autorize a câmera nas permissões do navegador e tente novamente.'
      );
    }else if(e && e.name==='NotFoundError'){
      mostrarErro('Nenhuma câmera foi encontrada neste dispositivo.');
    }else{
      mostrarErro(
        'Não foi possível abrir a câmera. Verifique a permissão da câmera e tente novamente.'
      );
    }
  }
}

function iniciarLeitura(){

  if(!ativo)return;

  if(!video.videoWidth || !video.videoHeight){
    animationFrame=requestAnimationFrame(iniciarLeitura);
    return;
  }

  if(!canvas){
    canvas=document.createElement('canvas');
    contexto=canvas.getContext('2d',{willReadFrequently:true});
  }

  const originalW=video.videoWidth;
  const originalH=video.videoHeight;
  const limite=1000;
  const escala=Math.min(1,limite/Math.max(originalW,originalH));

  const largura=Math.max(1,Math.round(originalW*escala));
  const altura=Math.max(1,Math.round(originalH*escala));

  canvas.width=largura;
  canvas.height=altura;

  contexto.drawImage(video,0,0,largura,altura);

  const imagem=contexto.getImageData(0,0,largura,altura);

  let resultado=null;

  if(typeof jsQR==='function'){
    resultado=jsQR(
      imagem.data,
      imagem.width,
      imagem.height,
      {inversionAttempts:'attemptBoth'}
    );
  }

  if(resultado && resultado.data){
    enviarResultado(resultado.data);
    return;
  }

  status.textContent='Aponte a câmera para o QR Code...';
  animationFrame=requestAnimationFrame(iniciarLeitura);
}

function enviarResultado(valor){

  if(!valor)return;

  ativo=false;
  pararCamera();

  const texto=String(valor).trim().toUpperCase();

  status.textContent='QR Code lido com sucesso.';

  // O retorno pela URL é o método principal.
  // Isso força o próprio App Montadores a receber o chassi
  // mesmo quando o celular/app não mantém window.opener.
  try{

    const parametros=new URLSearchParams(window.location.search || '');
    const retorno=parametros.get('retorno');

    if(retorno){

      const urlRetorno=new URL(retorno);
      urlRetorno.searchParams.set('qr',texto);
      const destino=urlRetorno.toString();

      // Se esta página foi aberta pelo App Montadores, manda
      // o próprio aplicativo navegar para a URL de retorno.
      // Assim o App Montadores abre novamente já com ?qr=CHASSI.
      if(window.opener && !window.opener.closed){

        try{
          window.opener.postMessage(
            {tipo:'CHASSI_QR',valor:texto},
            '*'
          );
        }catch(e){
          console.warn('postMessage não disponível:',e);
        }

        status.textContent='Chassi lido. Retornando ao aplicativo...';

        try{
          window.opener.location.href=destino;
        }catch(e){
          console.warn('Não foi possível redirecionar a janela original:',e);
          window.location.href=destino;
        }

        setTimeout(function(){
          try{ window.close(); }catch(e){}
        },500);

        return;
      }

      // Se não existe opener, o próprio leitor volta para o App.
      status.textContent='Chassi lido. Retornando ao aplicativo...';

      setTimeout(function(){
        window.location.replace(destino);
      },150);

      return;
    }

  }catch(e){
    console.error('Erro ao retornar o chassi pela URL:',e);
  }

  // Também tenta postMessage quando não existe URL de retorno.
  try{
    if(window.opener && !window.opener.closed){
      window.opener.postMessage(
        {tipo:'CHASSI_QR',valor:texto},
        '*'
      );
    }
  }catch(e){
    console.warn('Não foi possível usar window.opener:',e);
  }

  // Se não houver retorno configurado, permanece na tela.
  btnFechar.textContent='VOLTAR';
  status.textContent='QR lido: '+texto;
}

function pararCamera(){

  if(animationFrame){
    cancelAnimationFrame(animationFrame);
    animationFrame=null;
  }

  if(stream){
    stream.getTracks().forEach(function(track){
      track.stop();
    });
    stream=null;
  }

  video.srcObject=null;
}

btnFechar.addEventListener('click',function(){
  ativo=false;
  pararCamera();
  try{window.close();}catch(e){}
});

window.addEventListener('pagehide',function(){
  ativo=false;
  pararCamera();
});

iniciarCamera();
</script>
</body>
</html>
