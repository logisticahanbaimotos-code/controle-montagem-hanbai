<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="background-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Controle de Montagem">
  <meta name="description" content="Controle de Montagem — Hanbai Motos">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <title>Controle de Montagem</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    .loading {
      text-align: center;
      padding: 24px;
    }
    .loading img {
      width: min(70vw, 240px);
      height: auto;
      display: block;
      margin: 0 auto 24px;
    }
    .loading strong {
      display: block;
      font-size: 20px;
      letter-spacing: .5px;
    }
    .loading span {
      display: block;
      margin-top: 8px;
      opacity: .75;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="loading">
    <img src="./icons/icon-192.png" alt="Hanbai Motos">
    <strong>CONTROLE DE MONTAGEM</strong>
    <span>Abrindo o aplicativo...</span>
  </main>

  <script>
    // Este arquivo NÃO altera o App Montadores.
    // Ele apenas abre o endereço atual do aplicativo.
    const APP_URL = "https://script.google.com/macros/s/AKfycbwipsDyZg63-KzSRCViGk7T8wZ1gvIJTmbh5BdPen4eqHyT2EcDiyqaAUElNQugW4yS/exec";

    window.addEventListener("load", () => {
      setTimeout(() => {
        window.location.replace(APP_URL);
      }, 250);
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
